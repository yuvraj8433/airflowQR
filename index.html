<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Airflow at ACREX 202</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: Arial, Helvetica, sans-serif;
}

body{
    background: linear-gradient(135deg,#e6f0ff,#ffffff);
}

/* HERO */
.hero{
    background: url('https://images.unsplash.com/photo-1504384308090-c894fdcc538d?q=80&w=1600') center/cover no-repeat;
    padding:60px 20px;
    text-align:center;
    color:#000;
}

.logo{
    font-size:42px;
    font-weight:bold;
}

.logo span{
    color:#e11b22;
}

/* CARD */
.card{
    max-width:420px;
    margin:40px auto;
    background:#fff;
    padding:30px;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,0.15);
    text-align:center;
}

.card h2{
    margin-bottom:10px;
}

.booth{
    background:#e11b22;
    color:#fff;
    padding:12px;
    border-radius:10px;
    margin:15px 0;
    font-weight:bold;
}

/* BUTTONS */
.btn{
    display:block;
    text-decoration:none;
    padding:14px;
    margin:12px 0;
    border-radius:10px;
    color:#fff;
    font-weight:bold;
    transition:.3s;
}

.btn:hover{
    transform:scale(1.05);
}

.linkedin{background:#0077b5;}
.instagram{background:#e1306c;}
.facebook{background:#1877f2;}

/* FOOTER */
.footer{
    text-align:center;
    padding:25px;
    font-size:14px;
    color:#666;
}
</style>
</head>

<body>

<div class="hero">
    <div class="logo"><span>AIRFLOW</span> at ACREX 2026</div>
    <p>Meet Us at India’s Largest HVAC&R Exhibition</p>
</div>

<div class="card">
    <h2>Visit Us</h2>
    <div class="booth">Booth C26, Hall 6</div>

    <a class="btn linkedin"
       href="https://www.linkedin.com/company/m-s-air-flow-pvt--ltd-/"
       target="_blank">🔗 LinkedIn</a>

    <a class="btn instagram"
       href="https://www.instagram.com/airflowindia?igsh=MWxob2h2Zzk4OWRoMw=="
       target="_blank">📸 Instagram</a>

    <a class="btn facebook"
       href="https://www.facebook.com/airflowindia"
       target="_blank">👍 Facebook</a>
</div>

<div class="footer">
    © 2026 Airflow Pvt Ltd | Your Trusted Ventilation Partner
</div>

</body>
</html>
