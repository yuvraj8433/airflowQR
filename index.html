<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Follow Us</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg,#667eea,#764ba2);
    margin: 0;
    padding: 0;
    text-align: center;
    color: white;
}

.container {
    margin-top: 80px;
}

h1 {
    margin-bottom: 30px;
}

.btn {
    display: block;
    width: 250px;
    margin: 15px auto;
    padding: 15px;
    text-decoration: none;
    color: white;
    font-size: 18px;
    border-radius: 12px;
    font-weight: bold;
    transition: 0.3s;
}

.linkedin { background: #0077b5; }
.instagram { background: #e1306c; }
.facebook { background: #1877f2; }

.btn:hover {
    transform: scale(1.05);
}
</style>
</head>

<body>

<div class="container">
    <h1>🌟 Follow Us on Social Media</h1>

    <a class="btn linkedin" href="https://shorturl.re/7izck" target="_blank">
        🔗 LinkedIn
    </a>

    <a class="btn instagram" href="https://shorturl.re/7izcl" target="_blank">
        📸 Instagram
    </a>

    <a class="btn facebook" href="https://shorturl.re/7izcm" target="_blank">
        👍 Facebook
    </a>
</div>

</body>
</html>
